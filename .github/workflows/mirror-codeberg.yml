name: 'Mirror to Codeberg'

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
  mirror:
    name: Mirror to Codeberg
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # An old commit still contains an LFS pointer for a debug APK that was
      # committed by accident. The blob is not on Codeberg and is not worth
      # uploading, so let the push go through with the pointer alone.
      - name: Allow incomplete LFS push
        run: git config lfs.allowincompletepush true

      - name: Push to Codeberg
        uses: yesolutions/mirror-action@master
        with:
          REMOTE: 'https://codeberg.org/doen1el/calibre-web-companion.git'
          GIT_USERNAME: doen1el
          GIT_PASSWORD: ${{ secrets.CODEBERG_TOKEN }}
