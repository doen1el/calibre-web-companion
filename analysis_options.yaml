# Static analysis config. Run via `flutter analyze` (see .github/workflows/checks.yml).
#
# Lints can be suppressed per line/file with `// ignore: name_of_lint` and
# `// ignore_for_file: name_of_lint`. Full rule list: https://dart.dev/lints

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - packages/**
  errors:
    # CI analyzes with --fatal-infos, so everything enabled below blocks a merge.
    todo: ignore

linter:
  rules:
    # Correctness / latent bugs
    - avoid_slow_async_io
    - avoid_type_to_string
    - avoid_unused_constructor_parameters
    - cancel_subscriptions
    - close_sinks
    - literal_only_boolean_expressions
    - only_throw_errors
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements
    - use_string_buffers

    # Explicitness
    - always_declare_return_types
    - no_leading_underscores_for_local_identifiers
    - prefer_final_in_for_each
    - prefer_final_locals

    # Flutter widget hygiene
    - sized_box_for_whitespace
    - use_colored_box
    - use_decorated_box
    - use_super_parameters

    # Const-ness (rebuild cost)
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables

    # Noise removal
    - combinators_ordering
    - directives_ordering
    - prefer_single_quotes
    - unnecessary_await_in_return
    - unnecessary_breaks
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - unnecessary_underscores
